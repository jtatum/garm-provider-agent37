name: Check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: check-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Check (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    env:
      GOTOOLCHAIN: local
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.25.x'
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.13'
      - name: Check Go formatting
        run: test -z "$(gofmt -l $(git ls-files '*.go'))"
      - name: Check Python syntax
        run: |
          python3 - <<'PYTHON'
          import ast
          import subprocess
          from pathlib import Path
          for name in subprocess.check_output(['git', 'ls-files', '*.py'], text=True).splitlines():
              ast.parse(Path(name).read_text(), filename=name)
          PYTHON
      - name: Test and vet
        run: make check
      - name: Build
        run: make build
      - name: Build static Linux amd64 binary
        if: runner.os == 'Linux'
        env:
          GOOS: linux
          GOARCH: amd64
          CGO_ENABLED: '0'
        run: make build
